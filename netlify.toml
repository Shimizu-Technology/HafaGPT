[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Redirect the Netlify subdomain to the canonical domain.
[[redirects]]
  from = "https://hafagpt.netlify.app/*"
  to = "https://hafagpt.com/:splat"
  status = 301
  force = true

# Existing browser profiles may still be controlled by the pre-migration
# service worker, which can return a cached index.html that references a retired
# hashed entry module. Serve a stable JavaScript migration bridge for missing
# build assets so even that older page can unregister its worker, remove only
# obsolete app caches, and reload the current deploy. Existing assets shadow
# this rule and continue to be served normally.
[[redirects]]
  from = "/assets/*"
  to = "/stale-build-recovery.js"
  status = 200

# SPA fallback must remain after the domain and static-asset rules.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=(self), payment=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/stale-build-recovery.js"
  [headers.values]
    Content-Type = "application/javascript; charset=UTF-8"
    Cache-Control = "no-store"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
