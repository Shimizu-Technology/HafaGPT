name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    name: FastAPI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest pip-audit

      - name: Audit production dependencies
        # python-jose installs ecdsa, but HåfaGPT accepts RS256 only; the ECDSA-only
        # timing advisory is therefore not reachable. Keep the exception narrow.
        run: pip-audit --local --ignore-vuln PYSEC-2026-1325

      - name: Run backend tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q tests

      - name: Validate canonical vocabulary
        run: python scripts/validate_canonical_vocabulary.py --api-root .

      - name: Check language content
        run: python scripts/check_language_content_against_canonical.py --api-root .

      - name: Verify generated reports are current
        run: git diff --exit-code

  web:
    name: React web
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: http://127.0.0.1:8999
      # Clerk publishable keys are client-side, non-sensitive configuration.
      # A repository variable keeps public smoke tests runnable for fork PRs,
      # where GitHub intentionally withholds repository secrets.
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_E2E_CLERK_PUBLISHABLE_KEY }}
      VITE_PUBLIC_POSTHOG_KEY: ""
      VITE_PUBLIC_POSTHOG_HOST: ""
    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: Run critical browser flows
        run: npm run test:e2e

  content-sync:
    name: Cross-app content sync
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Compare static-audio manifests
        run: cmp api/audio_generation/manifest.json web/public/audio_manifest.json
