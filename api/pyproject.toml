[project]
name = "hafagpt-api"
version = "0.1.0"
description = "FastAPI and RAG backend for the HåfaGPT Chamorro learning platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "boto3>=1.43.72",
    "clerk-backend-api>=7.0.0",
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    # REMOVED: langchain-huggingface (900MB+ with torch/transformers)
    # We use langchain-openai for cloud embeddings (tiny memory footprint)
    "langchain-openai>=1.5.1",
    "langchain-postgres>=0.0.17",
    "openai>=3.1.0",
    "psycopg2-binary>=2.9.11",
    "psycopg[binary]>=3.3.4",
    "pypdf>=6.15.0",  # PDF text extraction (lightweight, no Java)
    "python-docx>=1.2.0",  # Word document parsing
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    # REMOVED: sentence-transformers (500MB+, only needed for local embeddings)
    "uvicorn>=0.52.3",
    # Model comparison dependencies
    "httpx>=0.27.0",  # For OpenRouter API client
    # Webhook verification
    "svix>=1.99.1",  # Clerk uses Svix for webhooks
    "gunicorn>=26.0.0",
    "uvicorn-worker>=0.4.0",
    # Crawl tooling still requires the 3.x ABI; LangSmith accepts it too.
    "xxhash>=3.5.0,<4",
    "tiktoken>=0.13.0",
    "sentry-sdk>=2.68.0",
]

# Optional dependencies for direct API access (instead of OpenRouter)
[project.optional-dependencies]
model-comparison = [
    "anthropic>=0.39.0",  # Direct Claude API
    "google-generativeai>=0.8.0",  # Direct Gemini API
]
tools = [
    "crawl4ai>=0.7.7",
    "langchain-community>=0.4.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "crawlers*"]
namespaces = false
